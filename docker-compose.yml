services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: product
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d product"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  # The API applies pending migrations itself on every start (database.auto_migrate: true).
  api:
    build: .
    environment:
      APP_ENV: docker         # non-"local" env switches gin to release mode
      DATABASE_HOST: postgres # overrides database.host in config/config.yaml
    ports:
      - "8080:8080"
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
