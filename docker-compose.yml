services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: product
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d product"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Runs pending migrations once, then exits.
  migrate:
    build: .
    entrypoint: ["/app/migrate", "up"]
    environment:
      DATABASE_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment:
      APP_ENV: docker         # non-"local" env switches gin to release mode
      DATABASE_HOST: postgres # overrides database.host in config/config.yaml
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
